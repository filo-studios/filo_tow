name: Release

on:
  push:
    branches: [main]
    paths: [fxmanifest.lua]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new version
        id: version
        run: |
          v=$(grep -oP "^\s*version\s+['\"]\K[^'\"]+" fxmanifest.lua)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            awk -v v="$v" '/^## /{p = ($2==v || $2=="v"v || $2=="["v"]"); next} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || true
          fi

      - name: Post patch notes
        if: steps.version.outputs.new == 'true'
        uses: filo-studios/release-notifier@v1
        with:
          webhook: ${{ secrets.DISCORD_PATCH_NOTES_WEBHOOK }}
          role-id: '1517205170927435958'
          # channel-id: '' # add this script's Discord channel ID
